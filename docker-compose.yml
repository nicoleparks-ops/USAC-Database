version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: usac-db
    environment:
      POSTGRES_USER: usac_user
      POSTGRES_PASSWORD: usac_password
      POSTGRES_DB: usac_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usac_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: usac-api
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://usac_user:usac_password@db:5432/usac_db
      WEBCONNEX_WEBHOOK_SECRET: your_webhook_secret_here
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
